# Apply after prometheus-rbac.yaml and prometheus-config.yaml:
#   kubectl apply -f k8s/observability/prometheus-deployment.yaml
# Open the UI (Status > Target health, Status > Service discovery):
#   kubectl port-forward -n observability deploy/prometheus 9090:9090
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
  labels:
    app: prometheus
spec:
  replicas: 1
  # TSDB locks its data dir: never run old and new Pod on the same data
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      # Token mounted at /var/run/secrets/kubernetes.io/serviceaccount,
      # used by kubernetes_sd_configs to list/watch the API server
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            # Enables POST /-/reload to pick up ConfigMap changes without a restart
            - --web.enable-lifecycle
          ports:
            - name: web
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Mount the directory, not a subPath: subPath mounts never receive ConfigMap updates
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        # Survives container restarts, lost when the Pod is deleted; replaced by a PVC later
        - name: data
          emptyDir: {}
