# Stable in-cluster address for Prometheus' HTTP API, used by Grafana:
#   http://prometheus.observability.svc:9090
#   kubectl apply -f k8s/observability/prometheus-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
      protocol: TCP
