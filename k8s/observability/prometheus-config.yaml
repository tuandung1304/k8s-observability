# After editing, apply and hot-reload (the kubelet syncs the volume in up to ~1 min):
#   kubectl apply -f k8s/observability/prometheus-config.yaml
#   kubectl exec -n observability deploy/prometheus -- wget -qO- --post-data= localhost:9090/-/reload
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      # One target per Node; node-exporter runs with hostNetwork on port 9100
      - job_name: "node-exporter"
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          # Discovered address is <InternalIP>:<kubelet port 10250>, swap the port
          - source_labels: [__address__]
            regex: "(.+):\\d+"
            replacement: "${1}:9100"
            target_label: __address__
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

      # Every Pod in "apps" annotated prometheus.io/scrape: "true"
      - job_name: "kubernetes-pods"
        kubernetes_sd_configs:
          - role: pod
            # Must match the namespaces granted by RoleBindings in prometheus-rbac.yaml
            namespaces:
              names: ["apps"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          # Pod role also returns Pending/Succeeded/Failed Pods
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: "Running"
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            regex: "(.+)"
            target_label: __metrics_path__
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: "(.+);(\\d+)"
            replacement: "${1}:${2}"
            target_label: __address__
          # __meta_* labels are dropped after relabeling; copy the useful ones
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
