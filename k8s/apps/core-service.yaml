# Apply after the Deployment:
#   kubectl apply -f k8s/apps/core-service.yaml
# Test from host:
#   kubectl port-forward -n apps svc/core 8080:80
#   curl localhost:8080/health/ready
apiVersion: v1
kind: Service
metadata:
  name: core
  namespace: apps
  labels:
    app: core
spec:
  type: ClusterIP
  selector:
    app: core
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
