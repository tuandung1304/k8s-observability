# Build & load image:
#   docker build -t nest-server:0.1.0 ./nest-server
#   kind load docker-image nest-server:0.1.0 --name k8s-observability
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-server
  namespace: default
  labels:
    app: nest-server
spec:
  replicas: 5
  # Immutable after creation; must match template labels
  selector:
    matchLabels:
      app: nest-server
  # Zero-downtime rollout: add 1 new Pod before removing an old one
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # New Pod must stay Ready this long before counting as available
  minReadySeconds: 5
  # Mark rollout as failed (not rolled back) if stuck this long
  progressDeadlineSeconds: 120
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: nest-server
    spec:
      # Budget for preStop sleep + app draining after SIGTERM
      terminationGracePeriodSeconds: 30
      containers:
        - name: nest-server
          image: nest-server:0.1.0
          # Image is loaded via `kind load`, never pull from a registry
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          lifecycle:
            preStop:
              # Delay SIGTERM until endpoints/kube-proxy stop routing to this Pod
              sleep:
                seconds: 5
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
