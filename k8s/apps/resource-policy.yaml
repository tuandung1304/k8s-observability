# Apply after the namespace, before any workload:
#   kubectl apply -f k8s/apps/resource-policy.yaml
# Check usage against the quota:
#   kubectl describe resourcequota -n apps
#   kubectl describe limitrange -n apps
#
# ResourceQuota caps the namespace total; LimitRange shapes each container.
# Once a quota tracks requests/limits, every new Pod must declare them;
# the LimitRange defaults below fill them in for Pods that don't.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: apps
spec:
  hard:
    # Sized for the core Deployment: 5 replicas + 1 surge Pod during rollout
    # (6 x 100m/128Mi requests, 6 x 200m/256Mi limits), plus headroom
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: objects
  namespace: apps
spec:
  hard:
    services: "10"
    configmaps: "20"
    secrets: "20"
    persistentvolumeclaims: "5"
    # Expose apps through ClusterIP + Ingress/Gateway, not one LB/NodePort each
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: apps
spec:
  limits:
    - type: Container
      # Applied when a container omits resources.requests
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      # Applied when a container omits resources.limits
      default:
        cpu: 500m
        memory: 512Mi
      # Reject containers asking for more than this
      max:
        cpu: "1"
        memory: 1Gi
